<div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black/55 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
  <div class="theme-card w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl border border-black/10 relative my-auto">
    <button id="btn-close-profile" onclick="closeProfileModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-sm">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="text-center mb-4">
      <div class="w-14 h-14 rounded-3xl bg-[#88A88E]/20 text-3xl flex items-center justify-center mx-auto mb-2">
        🌱
      </div>
      <h3 id="profile-modal-title" class="font-cozy text-xl font-bold">Welcome to Your Pocket Sanctuary!</h3>
      <p id="profile-modal-subtitle" class="text-xs opacity-75 mt-1">Tell your companion what to call you and when to celebrate your birthday.</p>
    </div>

    <form onsubmit="saveUserProfile(event)" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold mb-1">Your Preferred Name</label>
        <input
          type="text"
          id="input-user-name"
          placeholder="e.g., Alex, Maya, Sam..."
          maxlength="24"
          required
          class="w-full px-4 py-2.5 rounded-2xl bg-black/5 border border-transparent focus:border-[#88A88E] focus:outline-none text-sm font-medium"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Your Birthday (Month & Day)</label>
        <div class="grid grid-cols-2 gap-2.5">
          <select id="input-bday-month" class="px-3.5 py-2.5 rounded-2xl bg-black/5 border border-transparent focus:border-[#88A88E] focus:outline-none text-sm font-medium">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <select id="input-bday-day" class="px-3.5 py-2.5 rounded-2xl bg-black/5 border border-transparent focus:border-[#88A88E] focus:outline-none text-sm font-medium">
          </select>
        </div>
        <p class="text-[11px] opacity-65 mt-1">On your birthday, {{ brand.short }} throws a party with cake tasks & confetti!</p>
      </div>

      <div id="onboarding-pet-section" class="pt-1">
        <label class="block text-xs font-semibold mb-1">Companion Name & Spirit</label>
        <div class="flex gap-2">
          <input
            type="text"
            id="onboarding-pet-name"
            value="Mochi"
            maxlength="18"
            class="flex-1 px-3.5 py-2 rounded-2xl bg-black/5 border border-transparent focus:border-[#88A88E] focus:outline-none text-sm font-medium"
          />
          <select id="onboarding-pet-species" class="px-3 py-2 rounded-2xl bg-black/5 text-sm font-medium">
            <option value="sprout">🌱 Sprout</option>
            <option value="cloud">☁️ Cloud Cat</option>
            <option value="fox">🦊 Pebble Fox</option>
          </select>
        </div>
      </div>

      <div class="pt-2 border-t border-black/10">
        <label class="block text-xs font-semibold mb-1.5 flex items-center justify-between">
          <span>Seasonal & Celebration Preview</span>
          <span class="text-[10px] opacity-60 font-normal">Auto-detects real date by default</span>
        </label>
        <select id="select-holiday-override" onchange="applyCelebrationOverride(this.value)" class="w-full px-3.5 py-2 rounded-2xl bg-black/5 text-xs font-semibold focus:outline-none">
          <option value="auto">📅 Auto-Detect Real System Date</option>
          <option value="birthday">🎂 Preview My Birthday Celebration!</option>
          <option value="newyear">🎆 New Year's Celebration</option>
          <option value="valentine">💖 Valentine's Day</option>
          <option value="july4">🎇 Independence Day (4th of July)</option>
          <option value="halloween">🎃 Halloween Spooky Cozy</option>
          <option value="thanksgiving">🦃 Thanksgiving Harvest</option>
          <option value="christmas">🎄 Christmas & Winter Holidays</option>
          <option value="none">🌿 Regular Sanctuary Day</option>
        </select>
      </div>

      <button type="submit" class="w-full py-3 rounded-2xl bg-[#88A88E] hover:bg-[#77987D] text-white text-sm font-bold shadow-md transition-colors">
        Save & Enter Sanctuary ✨
      </button>
    </form>
  </div>
</div>
