<div id="breathing-modal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="theme-card w-full max-w-sm rounded-[2.5rem] p-6 text-center shadow-2xl border border-black/10 relative">
    <button onclick="closeBreathingModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/5 hover:bg-black/10 flex items-center justify-center text-sm">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <h3 class="font-cozy text-xl font-bold mb-1">Soft Breathing Pause</h3>
    <p class="text-xs opacity-70 mb-6">Breathe along with your companion for a moment of calm.</p>

    <div class="relative w-40 h-40 mx-auto flex items-center justify-center mb-6">
      <div id="breath-circle" class="w-24 h-24 rounded-full bg-[#88A88E]/30 border-2 border-[#88A88E] flex items-center justify-center transition-all duration-[4000ms] ease-in-out">
        <span id="breath-instruction" class="font-cozy font-semibold text-sm text-[#5D7F64]">Inhale...</span>
      </div>
    </div>

    <p class="text-xs opacity-75 mb-4">Let your shoulders drop away from your ears.</p>
    <button onclick="completeBreathingPause()" class="w-full py-2.5 rounded-2xl bg-[#88A88E] text-white text-sm font-semibold hover:bg-[#77987D] transition-colors">
      I Feel Grounded (+Mind & Joy)
    </button>
  </div>
</div>
